spring.application.name=stm32-smart-disinfector-java

# Server Configuration
server.port=8090

# Application Configuration
app.device.tcp-port=9000
app.device.ack-timeout-ms=4000
app.device.offline-timeout-ms=45000

# In-memory cache
app.cache.runtime-status-limit=10

# Logging
logging.level.com.suntianyu.stm32smartdisinfectorjava=INFO
