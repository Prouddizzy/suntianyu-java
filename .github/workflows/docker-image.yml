name: Build backend image

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag. Defaults to sha-<short-commit>.
        required: false
        default: ""
      push_to_ghcr:
        description: Push the built image to GitHub Container Registry.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stm32-smart-disinfector-java

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          TAG_INPUT=""
          PUSH_TO_GHCR="false"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_INPUT="${{ inputs.image_tag }}"
            if [ "${{ inputs.push_to_ghcr }}" = "true" ]; then
              PUSH_TO_GHCR="true"
            fi
          elif [ "${GITHUB_REF}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            PUSH_TO_GHCR="true"
          fi

          if [ -z "$TAG_INPUT" ]; then
            TAG="sha-${GITHUB_SHA::7}"
          else
            TAG="$TAG_INPUT"
          fi

          REF_SLUG="$(echo "${GITHUB_REF_NAME}" | tr '/[:upper:]' '-[:lower:]')"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref_slug=$REF_SLUG" >> "$GITHUB_OUTPUT"
          echo "push_to_ghcr=$PUSH_TO_GHCR" >> "$GITHUB_OUTPUT"
          echo "archive=stm32-smart-disinfector-java-${TAG}.tar" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          outputs: type=docker,dest=/tmp/${{ steps.meta.outputs.archive }}
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.ref_slug }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Load image into Docker
        run: docker load --input /tmp/${{ steps.meta.outputs.archive }}

      - name: Log in to GHCR
        if: ${{ steps.meta.outputs.push_to_ghcr == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned image to GHCR
        if: ${{ steps.meta.outputs.push_to_ghcr == 'true' }}
        run: |
          docker push "${IMAGE_NAME}:${{ steps.meta.outputs.tag }}"
          docker push "${IMAGE_NAME}:${{ steps.meta.outputs.ref_slug }}"

      - name: Push latest image to GHCR
        if: ${{ steps.meta.outputs.push_to_ghcr == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: docker push "${IMAGE_NAME}:latest"

      - name: Compress image archive
        run: gzip -f /tmp/${{ steps.meta.outputs.archive }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ steps.meta.outputs.tag }}
          path: /tmp/${{ steps.meta.outputs.archive }}.gz
          if-no-files-found: error
